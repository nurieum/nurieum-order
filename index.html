<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>누리이음 카페 주문 알림</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주문 알림">
<meta name="theme-color" content="#0B2A5B">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
:root{--navy:#0B2A5B;--blue:#0058B0;--sky:#EAF2FC;--yellow:#F5C400;--red:#D7141A;--ink:#1B1F27;--gray:#6A7280;--line:#E1E5EB;--bg:#F4F6F9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-0.02em}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#fff}
.top{background:var(--navy);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 26px}
.top .eng{font-size:11px;letter-spacing:.2em;color:var(--yellow);font-weight:600}
.top h1{font-size:22px;font-weight:800;margin-top:6px}
.top p{font-size:14px;opacity:.8;margin-top:6px}
.body{padding:24px 20px}
.status{border:1px solid var(--line);padding:18px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row b{font-weight:800}
.ok{color:var(--blue)}.no{color:var(--red)}
.btn{display:block;width:100%;height:56px;font:700 17px 'Noto Sans KR';background:var(--navy);color:#fff;border:none;margin-bottom:10px}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.guide{background:var(--sky);color:var(--navy);padding:16px;font-size:14px;line-height:1.7;margin-bottom:18px}
.guide b{font-weight:800}
.msg{font-size:13px;color:var(--gray);text-align:center;min-height:20px;margin-top:6px}
[hidden]{display:none!important}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eng">NURIEUM CAFE · ADMIN</div>
    <h1>단체 주문 알림 받기</h1>
    <p>새 딜리버리·케이터링 주문이 들어오면 이 폰으로 알림이 옵니다.</p>
  </div>
  <div class="body">
    <div class="guide" id="iosGuide" hidden>
      <b>아이폰은 먼저 홈 화면에 추가해야 합니다.</b><br>
      ① 사파리 아래쪽 <b>공유 버튼</b> 누르기<br>
      ② <b>홈 화면에 추가</b> 누르기<br>
      ③ 홈 화면에 생긴 <b>주문 알림</b> 아이콘으로 다시 열기
    </div>
    <div class="status">
      <div class="row"><span>알림 권한</span><b id="sPerm">확인 중…</b></div>
      <div class="row"><span>알림 구독</span><b id="sSub">확인 중…</b></div>
      <div class="row"><span>관리자 등록</span><b id="sAdm">확인 중…</b></div>
    </div>
    <button class="btn" id="btnOn">알림 받기</button>
    <button class="btn line" id="btnOff" hidden>이 폰에서 알림 끄기</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const APP_ID = "c0039316-e03e-449f-a2b4-3262ccc0eef0";
const $ = id => document.getElementById(id);
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
if (isIOS && !isStandalone) { $('iosGuide').hidden = false; }

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  try {
    await OneSignal.init({
      appId: APP_ID,
      serviceWorkerPath: "nurieum-order/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/nurieum-order/" },
      notifyButton: { enable: false }
    });
  } catch (e) { $('msg').textContent = '초기화 오류: ' + e.message; return; }

  const render = () => {
    const perm = OneSignal.Notifications.permission;
    const sub = OneSignal.User.PushSubscription.optedIn;
    const tags = OneSignal.User.getTags ? OneSignal.User.getTags() : {};
    const adm = tags && tags.role === 'admin';
    $('sPerm').textContent = perm ? '허용됨' : '꺼짐'; $('sPerm').className = perm ? 'ok' : 'no';
    $('sSub').textContent = sub ? '구독 중' : '안 됨'; $('sSub').className = sub ? 'ok' : 'no';
    $('sAdm').textContent = adm ? '등록됨' : '안 됨'; $('sAdm').className = adm ? 'ok' : 'no';
    $('btnOn').hidden = !!(sub && adm);
    $('btnOff').hidden = !sub;
  };
  render();
  OneSignal.Notifications.addEventListener('permissionChange', render);
  OneSignal.User.PushSubscription.addEventListener('change', render);

  $('btnOn').onclick = async () => {
    if (isIOS && !isStandalone) { $('msg').textContent = '위 안내대로 홈 화면에 추가한 뒤 그 아이콘으로 열어 주세요.'; return; }
    $('msg').textContent = '알림 허용 창이 뜨면 "허용"을 눌러 주세요.';
    try {
      await OneSignal.Notifications.requestPermission();
      await OneSignal.User.PushSubscription.optIn();
      OneSignal.User.addTag('role', 'admin');
      $('msg').textContent = '등록 완료! 이제 새 주문 알림이 이 폰으로 옵니다.';
    } catch (e) { $('msg').textContent = '오류: ' + e.message; }
    setTimeout(render, 800);
  };
  $('btnOff').onclick = async () => {
    await OneSignal.User.PushSubscription.optOut();
    OneSignal.User.removeTag('role');
    $('msg').textContent = '이 폰의 알림을 껐습니다.';
    setTimeout(render, 800);
  };
});
</script>
</body>
</html>
