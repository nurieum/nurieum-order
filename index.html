<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>누리이음 ORDER</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="누리이음 ORDER">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://n-script.googleusercontent.com">
<style>
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
:root{--navy:#0B2A5B;--blue:#0058B0;--sky:#EAF2FC;--yellow:#F5C400;--red:#D7141A;--ink:#1B1F27;--gray:#6A7280;--line:#E1E5EB;--bg:#F4F6F9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;overflow:hidden}
body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);letter-spacing:-0.02em;padding-top:env(safe-area-inset-top)}
#app{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;display:block;background:var(--bg)}
#splash{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .3s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:150px;height:150px;display:block}
#splash .sp{width:28px;height:28px;border-radius:50%;border:3px solid var(--sky);border-top-color:var(--navy);animation:spin .8s linear infinite}
#splash p{font-size:14px;color:var(--gray);font-weight:600;white-space:nowrap}
#splash p.err{white-space:normal}
#splash .err{color:var(--red);text-align:center;line-height:1.6;padding:0 24px}
#splash button{height:46px;padding:0 22px;background:var(--navy);color:#fff;border:0;font-size:15px;font-weight:700;font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#splash .sp{animation-duration:2s}}
/* 홈 화면에 추가 안내 */
.sheet-bg{position:fixed;inset:0;background:rgba(11,42,91,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:#fff;padding:22px 20px 18px;box-shadow:0 12px 40px rgba(11,42,91,.25);animation:up .2s ease-out}
@keyframes up{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.sh-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-top img{width:52px;height:52px;border-radius:12px;box-shadow:0 1px 3px rgba(11,42,91,.12),0 3px 10px rgba(11,42,91,.08)}
.sh-top b{display:block;font-size:18px;font-weight:800}
.sh-top span{font-size:13px;color:var(--gray)}
.sheet ol{list-style:none;border-top:2px solid var(--navy);margin-bottom:14px}
.sheet li{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px;word-break:keep-all}
.sheet li em{flex:0 0 26px;height:26px;background:var(--navy);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.sheet li i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;background:#fff;box-shadow:0 1px 3px rgba(11,42,91,.14),0 2px 6px rgba(11,42,91,.08);font-size:13px;font-weight:700;color:var(--navy);margin:0 3px;vertical-align:middle}
.sh-note{font-size:13px;color:var(--gray);background:var(--bg);padding:10px 12px;margin-bottom:14px;word-break:keep-all}
.sh-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-btns button{flex:1;height:50px;font-size:15px;font-weight:700;border:0;font-family:inherit}
.sh-btns .ok{background:var(--navy);color:#fff}
.sh-btns .ok:disabled{opacity:.55}
.sh-btns .off{color:var(--ink);background:#fff;box-shadow:0 1px 3px rgba(11,42,91,.10),0 3px 10px rgba(11,42,91,.06)}
.sh-btns .ok{box-shadow:0 3px 8px rgba(11,42,91,.22)}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="누리이음 ORDER"><div class="sp" id="sp"></div><p id="spMsg">잠시만 기다려 주세요.</p></div>
<iframe id="app" title="누리이음 카페 단체 주문" allow="clipboard-write"></iframe>
<script>
/* ===== ① Apps Script 배포 주소 (배포 후 여기만 바꾸면 됨) ===== */
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyM6-Eoi4ADC8T07AIhSQH7Hl-oaD8VleIokQAFRK3xRPmwD1t6Z4qhaRT-eUnA7imDHA/exec';
/* ===== ② OneSignal ===== */
const OS_APP_ID = '0656f30f-3182-4541-a141-a8918faab12a';
const BASE = '/nurieum-order/';

const $ = id => document.getElementById(id);
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_KAKAO = /KAKAOTALK/i.test(UA);
const IS_INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|everytimeApp|DaumApps/i.test(UA);
const IS_STANDALONE = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const qs = new URLSearchParams(location.search);
const OPEN_ADMIN = qs.get('admin') === '1';
const OPEN_MINE = qs.get('mine') === '1';
if (OPEN_ADMIN || OPEN_MINE) try { history.replaceState(null, '', location.pathname) } catch (e) {}

function get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch (e) { return d } }
function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
let dev = get('nr_dev', ''); if (!dev) { dev = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); set('nr_dev', dev) }

/* ===== 주문 앱 띄우기 ===== */
let shown = false;
function hideSplash() { if (shown) return; shown = true; $('splash').classList.add('hide'); setTimeout(() => $('splash').style.display = 'none', 350) }
if (EXEC_URL.indexOf('여기에') >= 0) {
  $('sp').remove(); $('spMsg').className = 'err'; $('spMsg').innerHTML = '아직 주문 앱 주소가 연결되지 않았어요.<br>index.html의 EXEC_URL에 배포 주소를 넣어 주세요.';
} else {
  $('app').src = EXEC_URL;
  setTimeout(() => { if (!shown) { $('spMsg').textContent = '거의 다 됐어요. 잠시만 기다려 주세요.' } }, 6000);
  setTimeout(() => {
    if (!shown) { $('sp').remove(); $('spMsg').className = 'err'; $('spMsg').innerHTML = '연결이 느려요. 인터넷 연결을 확인해 주세요.'; const b = document.createElement('button'); b.textContent = '다시 열기'; b.onclick = () => location.reload(); $('splash').appendChild(b) }
  }, 20000);
}

/* ===== 주문 앱과 대화 ===== */
let appWin = null;
function send(m) { if (appWin) try { appWin.postMessage(Object.assign({ src: 'nr-shell' }, m), '*') } catch (e) {} }
window.addEventListener('message', async e => {
  const d = e.data || {};
  if (d.src !== 'nr-app') return;
  if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) && e.origin !== location.origin) return;
  appWin = e.source;
  switch (d.t) {
    case 'ready':
      send({ t: 'hello', dev, mine: get('nr_mine', []), adm: get('nr_adm', ''), standalone: IS_STANDALONE, admin: OPEN_ADMIN, openMine: OPEN_MINE, a2off: get('nr_a2off', false), me: get('nr_me2', null), draft: get('nr_draft', null), perm: window.Notification ? Notification.permission : 'none' });
      break;
    case 'shown': hideSplash(); break;
    case 'mine': set('nr_mine', d.mine || []); break;
    case 'draft': set('nr_draft', d.d || null); break;
    case 'adm': set('nr_adm', d.token || ''); break;
    case 'a2hs': a2Go(); break;
    case 'push-get': send(Object.assign({ t: 'push' }, await pushState())); break;
    case 'push-on': send(Object.assign({ t: 'push' }, await pushOn())); break;
    case 'push-off': send(Object.assign({ t: 'push' }, await pushOff())); break;
    case 'me-on': { const m = await meOn(); set('nr_me2', m.ok ? { ok: true } : null); send(Object.assign({ t: 'me-push' }, m)); break; }
  }
});

/* ===== 홈 화면에 추가 ===== */
let a2Prompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); a2Prompt = e });
window.addEventListener('appinstalled', () => a2Done());
function a2Done() { set('nr_a2off', true); send({ t: 'a2hs-done' }) }
function a2Go() {
  if (a2Prompt) { a2Prompt.prompt(); a2Prompt.userChoice.then(c => { a2Prompt = null; if (c && c.outcome === 'accepted') a2Done() }); return }
  if (IS_KAKAO) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.origin + BASE); return }
  a2Sheet(IS_INAPP ? 'inapp' : IS_IOS ? 'ios' : 'android');
}
function a2Sheet(kind) {
  const steps = {
    ios: ['오른쪽 아래 <i>⋯</i> 를 누르세요', '<i>공유 ↑</i> 를 누르세요', '<i>홈 화면에 추가</i> 를 누르세요', '오른쪽 위 <i>추가</i> 를 누르세요'],
    android: ['오른쪽 위 <i>⋮</i> 를 누르세요', '<i>홈 화면에 추가</i> 를 누르세요', '<i>추가</i> 또는 <i>설치</i> 를 누르세요'],
    inapp: ['오른쪽 위(또는 아래) <i>⋯</i> 를 누르세요', '<i>다른 브라우저로 열기</i> 를 누르세요', '열린 화면에서 <i>추가하기</i> 를 누르세요']
  }[kind];
  const note = { ios: '※ <b>공유 ↑</b>가 바로 보이면 1번은 건너뛰세요.', android: '※ <b>크롬</b>에서 열어 주세요.', inapp: '※ 앱 안의 브라우저(카톡·네이버 등)에서는 홈 화면에 추가할 수 없어요.' }[kind];
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'a2sheet';
  bg.onclick = e => { if (e.target === bg) bg.remove() };
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="홈 화면에 추가 방법">
    <div class="sh-top"><img src="apple-touch-icon.png" alt=""><div><b>홈 화면에 앱 추가</b></div></div>
    <ol>${steps.map((s, i) => `<li><em>${i + 1}</em><span>${s}</span></li>`).join('')}</ol>
    <div class="sh-note">${note}</div>
    <div class="sh-btns"><button class="off" id="a2off">다시 보지 않기</button><button class="ok" id="a2ok">확인</button></div></div>`;
  document.body.appendChild(bg);
  $('a2off').onclick = () => { a2Done(); bg.remove() };
  $('a2ok').onclick = () => bg.remove();
}

/* ===== 관리자 폰 알림 (OneSignal) ===== */
let OS = null, osP = null;
/* 알림 기능은 관리자 화면 > 설정에 들어갔을 때만 불러옴 → 직원 폰에는 알림 팝업이 안 뜨고 첫 화면도 더 빨라짐 */
function loadOS() {
  if (osP) return osP;
  osP = new Promise(res => {
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      try {
        await OneSignal.init({
          appId: OS_APP_ID,
          serviceWorkerPath: BASE.slice(1) + 'OneSignalSDKWorker.js',
          serviceWorkerParam: { scope: BASE },
          notifyButton: { enable: false },
          // 자동 팝업은 끄고, 혹시 뜨는 경우에도 한글로 보이게
          promptOptions: { slidedown: { prompts: [{ type: 'push', autoPrompt: false, text: { actionMessage: '주문 알림을 받으려면 허용을 눌러 주세요.', acceptButton: '허용', cancelButton: '나중에' } }] } }
        });
        OS = OneSignal;
      } catch (e) { console.warn('OneSignal', e) }
      res();
    });
    const sc = document.createElement('script');
    sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; sc.defer = true;
    sc.onerror = () => res();
    document.head.appendChild(sc);
    setTimeout(res, 10000);
  });
  return osP;
}
async function pushState(err) {
  await loadOS();
  const needInstall = IS_IOS && !IS_STANDALONE;
  if (!OS) return { perm: false, sub: false, adm: false, needInstall, err: err || (needInstall ? '' : '알림 기능을 불러오지 못했어요. 새로고침해 주세요.') };
  let tags = {}; try { tags = OS.User.getTags() || {} } catch (e) {}
  if (tags.role === 'admin' && OS.User.PushSubscription.optedIn) set('nr_admpush', 1);
  return { perm: !!OS.Notifications.permission, sub: !!OS.User.PushSubscription.optedIn, adm: tags.role === 'admin', needInstall, err: err || '' };
}
/* 알림 허용은 '손가락으로 누른 바로 그 순간'에 물어야 휴대폰이 받아줌.
   → 주문 앱 안 버튼이 아니라, 바깥(이 페이지)에 안내창을 띄우고 그 버튼에서 바로 허용을 요청 */
function permSheet(title, desc) {
  return new Promise(done => {
    const old = $('pmsheet'); if (old) old.remove();
    const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'pmsheet';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${title}">
      <div class="sh-top"><img src="apple-touch-icon.png" alt=""><div><b>${title}</b><span>${desc}</span></div></div>
      <div class="sh-note" style="white-space:nowrap">다음 화면에서 <b>허용</b>을 누르세요.</div>
      <div class="sh-btns"><button class="off" id="pmNo">나중에</button><button class="ok" id="pmOk" disabled>준비 중…</button></div></div>`;
    document.body.appendChild(bg);
    const ok = $('pmOk'), close = r => { bg.remove(); done(r) };
    $('pmNo').onclick = () => close({ cancel: true });
    bg.onclick = e => { if (e.target === bg) close({ cancel: true }) };
    loadOS().then(() => {
      if (!OS) { close({ err: '알림 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.' }); return }
      ok.disabled = false; ok.textContent = '알림 허용하기';
    });
    ok.onclick = () => {
      ok.disabled = true; ok.textContent = '확인 중…';
      // ★ 기다리는 것 없이 '바로' 허용 요청 (아이폰·안드로이드 모두 이래야 창이 뜸)
      // 허용 요청과 알림 등록(구독)을 같은 '한 번의 누름' 안에서 시작해야
      // 아이폰에서 OneSignal의 영어 안내창(Subscribe)이 따로 뜨지 않음
      let p;
      const granted = () => !!(window.Notification && Notification.permission === 'granted') || !!(OS && OS.Notifications.permission);
      try {
        if (OS && granted() && !OS.User.PushSubscription.optedIn) p = OS.User.PushSubscription.optIn();
        else if (OS && !granted()) p = OS.Notifications.requestPermission();
        else if (!OS && window.Notification && Notification.permission !== 'granted') p = Notification.requestPermission();
        else p = Promise.resolve();
      } catch (e) { p = Promise.resolve() }
      Promise.resolve(p).then(() => close({ perm: granted() })).catch(() => close({ perm: granted() }));
    };
  });
}
/* 허용 뒤 OneSignal에 구독 + 이름표(태그) 달기, 실제로 구독됐는지 확인 */
async function subscribe(tagK, tagV) {
  if (!OS.User.PushSubscription.optedIn && !IS_IOS) { try { await OS.User.PushSubscription.optIn() } catch (e) {} }
  for (let i = 0; i < 27 && !(OS.User.PushSubscription.optedIn && OS.User.PushSubscription.id); i++) await new Promise(r => setTimeout(r, 300));
  if (!OS.User.PushSubscription.optedIn) { laterSub(tagK, tagV); return false }
  OS.User.addTag(tagK, tagV);
  return !!OS.User.PushSubscription.optedIn;
}
/* 혹시 OneSignal 영어 창이 떠서 거기서 허용했을 때도 자동으로 마무리 */
let laterOn = false;
function laterSub(tagK, tagV) {
  if (laterOn || !OS) return; laterOn = true;
  try {
    OS.User.PushSubscription.addEventListener('change', ev => {
      const cur = (ev && ev.current) || OS.User.PushSubscription;
      if (!cur.optedIn) return;
      OS.User.addTag(tagK, tagV);
      if (tagK === 'dev') { set('nr_me2', { ok: true }); send({ t: 'me-push', ok: true, sid: cur.id || OS.User.PushSubscription.id || '' }) }
      else { set('nr_admpush', 1); pushState().then(st => send(Object.assign({ t: 'push' }, st))) }
    });
  } catch (e) {}
}
const WAIT_MSG = '화면 아래 창에서 허용을 눌러 주세요.';
const BLOCKED = IS_IOS ? '알림이 꺼져 있어요. 아이폰 설정 → 알림 → 누리이음 ORDER → 알림 허용을 켠 뒤 다시 눌러 주세요.'
  : IS_STANDALONE ? '알림이 차단돼 있어요. 홈 화면의 누리이음 ORDER 아이콘을 길게 누르고 → 앱 정보 → 알림 → 허용으로 바꾼 뒤 다시 눌러 주세요.'
  : '알림이 차단돼 있어요. 크롬 주소창 왼쪽 아이콘 → 권한(또는 사이트 설정) → 알림 → 허용으로 바꾼 뒤 다시 눌러 주세요.';
async function pushOn() {
  if (IS_IOS && !IS_STANDALONE) return pushState();
  if (window.Notification && Notification.permission === 'denied') return pushState(BLOCKED);
  const r = await permSheet('관리자 주문 알림 받기', '새 주문·주문 취소 시 알려 드려요');
  if (r.cancel) return pushState();
  if (r.err) return pushState(r.err);
  if (!r.perm) return pushState(BLOCKED);
  try { if (!await subscribe('role', 'admin')) return pushState(WAIT_MSG); set('nr_admpush', 1) }
  catch (e) { return pushState('알림을 켜지 못했어요: ' + e.message) }
  return pushState();
}
/* 직원 — 이 폰에서 넣은 주문이 출발하면 알림 (기기 번호로 구분) */
async function meOn() {
  if (IS_IOS && !IS_STANDALONE) return { ok: false, needInstall: true };
  if (window.Notification && Notification.permission === 'denied') return { ok: false, blocked: true, err: BLOCKED };
  const r = await permSheet('주문 알림 받기', '주문 확정·출발·전달 완료 시 알려 드려요');
  if (r.cancel) return { ok: false, cancel: true };
  if (r.err) return { ok: false, err: r.err };
  if (!r.perm) return { ok: false, err: BLOCKED };
  try { if (!await subscribe('dev', dev)) return { ok: false, wait: true, err: WAIT_MSG } }
  catch (e) { return { ok: false, err: '알림을 켜지 못했어요: ' + e.message } }
  return { ok: true, sid: OS.User.PushSubscription.id || '' };
}
/* 이미 허용한 폰은 열 때마다 조용히 이름표 다시 확인 (허용 창은 안 뜸) */
if (get('nr_me2', null) && window.Notification && Notification.permission === 'granted' && !(IS_IOS && !IS_STANDALONE)) {
  setTimeout(() => loadOS().then(() => {
    (async () => {
      try {
        if (!OS) return;
        // 구독이 풀려 있으면 (권한은 이미 허용이라 창 없이) 다시 연결
        if (!OS.User.PushSubscription.optedIn && !IS_IOS) { await OS.User.PushSubscription.optIn(); for (let i = 0; i < 20 && !OS.User.PushSubscription.id; i++) await new Promise(r => setTimeout(r, 300)) }
        if (OS.User.PushSubscription.optedIn) { OS.User.addTag('dev', dev); if (OS.User.PushSubscription.id) send({ t: 'me-sid', sid: OS.User.PushSubscription.id }) }
      } catch (e) {}
    })();
  }), 4000);
}
/* 관리자 폰도 열 때마다 조용히 연결 상태 확인 (구독이 풀렸으면 다시 연결, 관리자 이름표 유지) */
if (get('nr_admpush', 0) && window.Notification && Notification.permission === 'granted' && !(IS_IOS && !IS_STANDALONE)) {
  setTimeout(() => loadOS().then(async () => {
    try {
      if (!OS) return;
      if (!OS.User.PushSubscription.optedIn && !IS_IOS) { await OS.User.PushSubscription.optIn(); for (let i = 0; i < 20 && !OS.User.PushSubscription.id; i++) await new Promise(r => setTimeout(r, 300)) }
      if (OS.User.PushSubscription.optedIn) OS.User.addTag('role', 'admin');
    } catch (e) {}
  }), 5000);
}
async function pushOff() {
  await loadOS();
  try { if (OS) { await OS.User.PushSubscription.optOut(); OS.User.removeTag('role') } } catch (e) {}
  set('nr_admpush', 0);
  await new Promise(r => setTimeout(r, 500));
  return pushState();
}
</script>
