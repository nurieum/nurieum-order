<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>누리이음 ORDER</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="누리이음 ORDER">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://n-script.googleusercontent.com">
<style>
:root{--navy:#0B2A5B;--blue:#0058B0;--sky:#EAF2FC;--yellow:#F5C400;--red:#D7141A;--ink:#1B1F27;--gray:#6A7280;--line:#E1E5EB;--bg:#F4F6F9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;overflow:hidden}
body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);letter-spacing:-0.02em;padding-top:env(safe-area-inset-top)}
#app{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;display:block;background:var(--bg)}
#splash{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .3s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:150px;height:150px;display:block}
#splash .sp{width:28px;height:28px;border-radius:50%;border:3px solid var(--sky);border-top-color:var(--navy);animation:spin .8s linear infinite}
#splash p{font-size:14px;color:var(--gray);font-weight:600}
#splash .err{color:var(--red);text-align:center;line-height:1.6;padding:0 24px}
#splash button{height:46px;padding:0 22px;background:var(--navy);color:#fff;border:0;font-size:15px;font-weight:700;font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#splash .sp{animation-duration:2s}}
/* 홈 화면에 추가 안내 */
.sheet-bg{position:fixed;inset:0;background:rgba(11,42,91,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:#fff;padding:22px 20px 18px;box-shadow:0 12px 40px rgba(11,42,91,.25);animation:up .2s ease-out}
@keyframes up{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.sh-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-top img{width:52px;height:52px;border-radius:12px;border:1px solid var(--line)}
.sh-top b{display:block;font-size:18px;font-weight:800}
.sh-top span{font-size:13px;color:var(--gray)}
.sheet ol{list-style:none;border-top:2px solid var(--navy);margin-bottom:14px}
.sheet li{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px;word-break:keep-all}
.sheet li em{flex:0 0 26px;height:26px;background:var(--navy);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.sheet li i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--navy);margin:0 2px;vertical-align:middle}
.sh-note{font-size:12.5px;color:var(--gray);background:var(--bg);padding:10px 12px;margin-bottom:14px;word-break:keep-all}
.sh-btns{display:flex;gap:8px}
.sh-btns button{flex:1;height:50px;font-size:15px;font-weight:700;border:0;font-family:inherit}
.sh-btns .ok{background:var(--navy);color:#fff}
.sh-btns .off{flex:0 0 40%;border:1px solid var(--line);color:var(--gray);background:#fff}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="누리이음 ORDER"><div class="sp" id="sp"></div><p id="spMsg">불러오는 중이에요</p></div>
<iframe id="app" title="누리이음 카페 단체 주문" allow="clipboard-write"></iframe>
<script>
/* ===== ① Apps Script 배포 주소 (배포 후 여기만 바꾸면 됨) ===== */
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyM6-Eoi4ADC8T07AIhSQH7Hl-oaD8VleIokQAFRK3xRPmwD1t6Z4qhaRT-eUnA7imDHA/exec';
/* ===== ② OneSignal ===== */
const OS_APP_ID = '0656f30f-3182-4541-a141-a8918faab12a';
const BASE = '/nurieum-order/';

const $ = id => document.getElementById(id);
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_KAKAO = /KAKAOTALK/i.test(UA);
const IS_INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|everytimeApp|DaumApps/i.test(UA);
const IS_STANDALONE = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const qs = new URLSearchParams(location.search);
const OPEN_ADMIN = qs.get('admin') === '1';
if (OPEN_ADMIN) try { history.replaceState(null, '', location.pathname) } catch (e) {}

function get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch (e) { return d } }
function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
let dev = get('nr_dev', ''); if (!dev) { dev = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); set('nr_dev', dev) }

/* ===== 주문 앱 띄우기 ===== */
let shown = false;
function hideSplash() { if (shown) return; shown = true; $('splash').classList.add('hide'); setTimeout(() => $('splash').style.display = 'none', 350) }
if (EXEC_URL.indexOf('여기에') >= 0) {
  $('sp').remove(); $('spMsg').className = 'err'; $('spMsg').innerHTML = '아직 주문 앱 주소가 연결되지 않았어요.<br>index.html의 EXEC_URL에 배포 주소를 넣어 주세요.';
} else {
  $('app').src = EXEC_URL;
  setTimeout(() => { if (!shown) { $('spMsg').textContent = '조금만 기다려 주세요…' } }, 6000);
  setTimeout(() => {
    if (!shown) { $('sp').remove(); $('spMsg').className = 'err'; $('spMsg').innerHTML = '연결이 느려요. 인터넷 연결을 확인해 주세요.'; const b = document.createElement('button'); b.textContent = '다시 열기'; b.onclick = () => location.reload(); $('splash').appendChild(b) }
  }, 20000);
}

/* ===== 주문 앱과 대화 ===== */
let appWin = null;
function send(m) { if (appWin) try { appWin.postMessage(Object.assign({ src: 'nr-shell' }, m), '*') } catch (e) {} }
window.addEventListener('message', async e => {
  const d = e.data || {};
  if (d.src !== 'nr-app') return;
  if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) && e.origin !== location.origin) return;
  appWin = e.source;
  switch (d.t) {
    case 'ready':
      send({ t: 'hello', dev, mine: get('nr_mine', []), adm: get('nr_adm', ''), standalone: IS_STANDALONE, admin: OPEN_ADMIN, a2off: get('nr_a2off', false) });
      break;
    case 'shown': hideSplash(); break;
    case 'mine': set('nr_mine', d.mine || []); break;
    case 'adm': set('nr_adm', d.token || ''); break;
    case 'a2hs': a2Go(); break;
    case 'push-get': send(Object.assign({ t: 'push' }, await pushState())); break;
    case 'push-on': send(Object.assign({ t: 'push' }, await pushOn())); break;
    case 'push-off': send(Object.assign({ t: 'push' }, await pushOff())); break;
  }
});

/* ===== 홈 화면에 추가 ===== */
let a2Prompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); a2Prompt = e });
window.addEventListener('appinstalled', () => a2Done());
function a2Done() { set('nr_a2off', true); send({ t: 'a2hs-done' }) }
function a2Go() {
  if (a2Prompt) { a2Prompt.prompt(); a2Prompt.userChoice.then(c => { a2Prompt = null; if (c && c.outcome === 'accepted') a2Done() }); return }
  if (IS_KAKAO) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.origin + BASE); return }
  a2Sheet(IS_INAPP ? 'inapp' : IS_IOS ? 'ios' : 'android');
}
function a2Sheet(kind) {
  const steps = {
    ios: ['아래쪽 가운데 <i>공유 ↑</i> 버튼을 누르세요', '목록을 올려서 <i>홈 화면에 추가</i>를 누르세요', '오른쪽 위 <i>추가</i>를 누르면 끝'],
    android: ['오른쪽 위 <i>⋮</i> 메뉴를 누르세요', '<i>홈 화면에 추가</i> 또는 <i>앱 설치</i>를 누르세요', '<i>추가</i>(설치)를 누르면 끝'],
    inapp: ['오른쪽 위(또는 아래) <i>⋯</i> 메뉴를 누르세요', '<i>다른 브라우저로 열기</i>를 누르세요', '열린 화면에서 다시 <i>추가하기</i>를 누르세요']
  }[kind];
  const note = { ios: '※ 아이폰은 <b>사파리</b>에서만 홈 화면에 추가할 수 있어요.', android: '※ 안드로이드는 <b>크롬</b>에서 열어 주세요.', inapp: '※ 앱 안의 브라우저(카톡·네이버 등)에서는 홈 화면에 추가할 수 없어요.' }[kind];
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'a2sheet';
  bg.onclick = e => { if (e.target === bg) bg.remove() };
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="홈 화면에 추가 방법">
    <div class="sh-top"><img src="apple-touch-icon.png" alt=""><div><b>홈 화면에 추가하는 방법</b><span>한 번만 해 두면 다음부터 아이콘으로 열려요</span></div></div>
    <ol>${steps.map((s, i) => `<li><em>${i + 1}</em><span>${s}</span></li>`).join('')}</ol>
    <div class="sh-note">${note}</div>
    <div class="sh-btns"><button class="off" id="a2off">다시 보지 않기</button><button class="ok" id="a2ok">확인</button></div></div>`;
  document.body.appendChild(bg);
  $('a2off').onclick = () => { a2Done(); bg.remove() };
  $('a2ok').onclick = () => bg.remove();
}

/* ===== 관리자 폰 알림 (OneSignal) ===== */
let OS = null;
const osReady = new Promise(res => {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.init({ appId: OS_APP_ID, serviceWorkerPath: BASE.slice(1) + 'OneSignalSDKWorker.js', serviceWorkerParam: { scope: BASE }, notifyButton: { enable: false } });
      OS = OneSignal;
    } catch (e) { console.warn('OneSignal', e) }
    res();
  });
  setTimeout(res, 8000);
});
async function pushState(err) {
  await osReady;
  const needInstall = IS_IOS && !IS_STANDALONE;
  if (!OS) return { perm: false, sub: false, adm: false, needInstall, err: err || (needInstall ? '' : '알림 기능을 불러오지 못했어요. 새로고침해 주세요.') };
  let tags = {}; try { tags = OS.User.getTags() || {} } catch (e) {}
  return { perm: !!OS.Notifications.permission, sub: !!OS.User.PushSubscription.optedIn, adm: tags.role === 'admin', needInstall, err: err || '' };
}
async function pushOn() {
  await osReady;
  if (IS_IOS && !IS_STANDALONE) return pushState();
  if (!OS) return pushState();
  try {
    await OS.Notifications.requestPermission();
    if (!OS.Notifications.permission) return pushState('알림이 차단돼 있어요. 휴대폰 설정에서 이 앱(또는 브라우저)의 알림을 허용해 주세요.');
    await OS.User.PushSubscription.optIn();
    OS.User.addTag('role', 'admin');
    await new Promise(r => setTimeout(r, 900));
  } catch (e) { return pushState('알림을 켜지 못했어요: ' + e.message) }
  return pushState();
}
async function pushOff() {
  await osReady;
  try { if (OS) { await OS.User.PushSubscription.optOut(); OS.User.removeTag('role') } } catch (e) {}
  await new Promise(r => setTimeout(r, 500));
  return pushState();
}
</script>
</body>
</html>
